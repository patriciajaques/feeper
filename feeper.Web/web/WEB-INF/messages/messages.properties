label.boasvindas.descricao=Esta \u00e9 uma ferramenta experimental que tem o objetivo de auxiliar os alunos dos cursos de TI da Unisinos. Atrav\u00e9s dela voc\u00ea poder\u00e1 realizar exerc\u00edcios e tamb\u00e9m acompanhar o que seus colegas est\u00e3o fazendo. Voc\u00ea ainda conta com recursos para facilitar o registro e envio de d\u00favidas ao professor. Ao tentar solucionar um exerc\u00edcio, em caso de erro, o feeper ir\u00e1 lhe informar como proceder para solucionar este problema.
